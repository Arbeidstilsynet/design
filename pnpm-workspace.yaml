packages:
  - packages/*
  - apps/*
  - tools/*

allowBuilds:
  esbuild: false

autoDedupe: true

audit:
  level: high
  ignore:
    # no fix for braces
    - GHSA-vfj7-8cjw-p6xm

autoInstallPeers: false

minimumReleaseAge: 4320

minimumReleaseAgeExcludePrune: true

overrides:
  nanoid@<3.3.17: "3.3.20"
  simple-git@<=3.36.0: ^4.0.0

trustPolicy: no-downgrade

trustPolicyExclude:
  - cssnano*
  - postcss-*
  - rxjs@7.8.2
  - semver@6.3.1

trustPolicyExcludePrune: true
