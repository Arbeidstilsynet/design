packages:
  - packages/*
  - apps/*
  - tools/*

allowBuilds:
  esbuild: false

auditConfig:
  ignoreGhsas:
    # js-yaml@3.x used through @changesets/cli, not realistically exploitable without repo access
    # intermediary deps would need overrides to resolve, wait and see if they get updates
    # or wait for @changesets/cli v3 which upgrades intermediary @manypkg/get-packages to not depend on js-yaml
    - GHSA-h67p-54hq-rp68

autoInstallPeers: false

minimumReleaseAge: 4320

minimumReleaseAgeExclude:
  - shell-quote@1.8.5
  - svgo@4.0.2
  - brace-expansion@5.0.8
  - '@chromatic-com/storybook@5.3.0'
  - js-yaml@3.15.1 || 4.3.1

overrides:
  esbuild: "0.28.1"
  nanoid@<3.3.17: "3.3.18"

trustPolicy: no-downgrade

trustPolicyExclude:
  - rxjs@7.8.2
  - semver@6.3.1
  - semver@5.7.2
