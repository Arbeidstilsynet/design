packages:
  - packages/*
  - apps/*
  - tools/*

allowBuilds:
  esbuild: false

auditConfig:
  ignoreGhsas:
    # no fix
    - GHSA-vfj7-8cjw-p6xm


autoInstallPeers: false

minimumReleaseAge: 4320

minimumReleaseAgeExclude:
  - shell-quote@1.8.5
  - svgo@4.0.2
  - brace-expansion@5.0.8
  - '@chromatic-com/storybook@5.3.0'
  - js-yaml@3.15.1 || 4.3.1

overrides:
  nanoid@<3.3.17: "3.3.19"
  simple-git@<=3.36.0: ^4.0.0

trustPolicy: no-downgrade

trustPolicyExclude:
  - cssnano*
  - postcss-*
  - stylehacks@9.0.4
  - rxjs@7.8.2
  - semver@6.3.1
  - semver@5.7.2
