name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    outputs:
      published: ${{ steps.changeset.outputs.published }}
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        id: app-token
        with:
          client-id: ${{ vars.BETZY_BOT_CLIENT_ID }}
          private-key: ${{ secrets.BETZY_BOT_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
      - uses: Arbeidstilsynet/action-pnpm-setup@4aeb1a864b04a516dde352e3675d5ab96f1741b2 # v3

      - uses: changesets/action@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1
        id: changeset
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          version-script: pnpm run version
          publish-script: pnpm run release
          commit-message: "chore(release): 📦 version packages"
          pr-title: "chore(release): 📦 version packages"
          push-with-git-cli: true

      - name: Notify Slack about published packages
        if: steps.changeset.outputs.published == 'true'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          PUBLISHED_PACKAGES: ${{ steps.changeset.outputs.published-packages }}
          CHANNEL_NAME: "#plattform"
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_URL is not set. Skipping Slack notification."
            exit 0
          fi

          if [ -z "$PUBLISHED_PACKAGES" ]; then
            echo "PUBLISHED_PACKAGES is empty. Skipping Slack notification."
            exit 0
          fi

          # Turn JSON array into a readable bullet list:
          PACKAGES_TEXT=$(echo "$PUBLISHED_PACKAGES" | jq -r 'map("- \(.name) \(.version)") | join("\n")')

          # Build text with a real newline before the first bullet
          TEXT=$(printf 'New versions published to NPM from https://github.com/Arbeidstilsynet/design\n%s' "$PACKAGES_TEXT")

          payload=$(jq -Rn \
            --arg text "$TEXT" \
            --arg channel "$CHANNEL_NAME" \
            '{channel:$channel, text:$text}')

          curl -fsS -X POST --data-urlencode "payload=$payload" "$SLACK_WEBHOOK_URL" || {
            echo "Slack notification failed"
            exit 1
          }

  deploy_prod:
    needs: release
    if: needs.release.outputs.published == 'true'
    name: Deploy Storybook prod
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-storybook-nais.yml
    with:
      cluster: prod
      vars: .nais/vars-prod.yml
