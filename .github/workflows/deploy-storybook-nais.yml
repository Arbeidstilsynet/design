name: Deploy Storybook to Nais (reusable)

on:
  workflow_call:
    inputs:
      cluster:
        required: true
        type: string
      vars:
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: nais/docker-build-push@423a915c9b72edf2ba848b88171ccb0489e2a40a # v0
        id: docker
        with:
          team: plattform
      - uses: nais/deploy/actions/deploy@9850be311389ca754d9a9f2280615419d738c891 # v3
        env:
          CLUSTER: ${{ inputs.cluster }}
          RESOURCE: .nais/storybook.yml
          WORKLOAD_IMAGE: ${{ steps.docker.outputs.image }}
          VARS: ${{ inputs.vars }}
