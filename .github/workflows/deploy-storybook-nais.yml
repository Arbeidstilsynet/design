name: Deploy Storybook to Nais (reusable)

on:
  workflow_call:
    inputs:
      cluster:
        required: true
        type: string
      vars:
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: nais/docker-build-push@dd7421d5068057a020ca46ead966c26190c516b1 # v0
        id: docker
        with:
          team: plattform
      - uses: nais/deploy/actions/deploy@d003bddf74ce5b96fa3056ae60bd4b9b3bbc89ef # v3
        env:
          CLUSTER: ${{ inputs.cluster }}
          RESOURCE: .nais/storybook.yml
          WORKLOAD_IMAGE: ${{ steps.docker.outputs.image }}
          VARS: ${{ inputs.vars }}
