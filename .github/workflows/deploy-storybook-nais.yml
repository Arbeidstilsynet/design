name: Deploy Storybook to Nais (reusable)

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      mixin:
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: nais/docker-build-push@dd7421d5068057a020ca46ead966c26190c516b1 # v0
        id: docker
        with:
          team: plattform
      - uses: nais/setup@fb8692f65df9c904e2cdac5d395630ac876abdcf # v1.0.3
        with:
          team: plattform
      - name: Deploy to Nais
        env:
          NAIS_ENVIRONMENT: ${{ inputs.environment }}
          NAIS_MIXIN: ${{ inputs.mixin }}
          WORKLOAD_IMAGE: ${{ steps.docker.outputs.image }}
        run: |
          nais apply .nais/storybook.yml \
            --environment "$NAIS_ENVIRONMENT" \
            --mixin "$NAIS_MIXIN" \
            --set "spec.image=$WORKLOAD_IMAGE" \
            --wait
